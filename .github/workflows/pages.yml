name: Deploy learning portal
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/bootstrap.json
            /docs/pages-manifest.json
      - uses: actions/configure-pages@v5
      - name: Prepare verified current public site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), cp = require('node:child_process');
          const manifest = JSON.parse(fs.readFileSync('docs/pages-manifest.json', 'utf8'));
          const bootstrap = JSON.parse(fs.readFileSync('docs/bootstrap.json', 'utf8'));
          const id = bootstrap.releaseId;
          if (manifest.release !== id || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{12}$/.test(id)) throw Error('Invalid release');
          const files = [...manifest.public_files, 'pages-manifest.json'];
          for (const file of files) if (!/^[A-Za-z0-9_./-]+$/.test(file) || file.split('/').includes('..') || file.startsWith('/') || file.startsWith('releases/')) throw Error('Invalid public path');
          const patterns = [...files.map(f => '/docs/' + f), '/docs/releases/' + id + '/'].join('\n') + '\n';
          const result = cp.spawnSync('git', ['sparse-checkout', 'set', '--no-cone', '--stdin'], {input: patterns, encoding: 'utf8'});
          if (result.status !== 0) throw Error(result.stderr || 'Sparse checkout failed');
          const output = path.join(process.env.RUNNER_TEMP, 'levelup-pages');
          fs.mkdirSync(output, {recursive: true});
          for (const file of files) {
            const source = path.join('docs', file), target = path.join(output, file);
            if (!fs.lstatSync(source).isFile()) throw Error('Public file is not a regular file');
            fs.mkdirSync(path.dirname(target), {recursive: true}); fs.copyFileSync(source, target);
          }
          fs.cpSync(path.join('docs/releases', id), path.join(output, 'releases', id), {recursive: true});
          console.log('Prepared verified current release:', id);
          NODE
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: ${{ runner.temp }}/levelup-pages
      - name: Deploy current artifact with GitHub Pages API
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw Error('Missing verified Pages artifact');
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: token
            });
            if (!deployment.id) throw Error('GitHub did not return a Pages deployment');
            core.setOutput('page_url', deployment.page_url);
            const deadline = Date.now() + 30 * 60 * 1000;
            const failed = new Set(['errored', 'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_perms_error', 'deployment_lost', 'auth_error', 'rendering_error', 'artifact_fetch_failed', 'artifact_unpack_failed']);
            let last = '', errors = 0;
            while (Date.now() < deadline) {
              let status;
              try {
                const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {...context.repo, deploymentId: deployment.id});
                status = result.data.status; errors = 0;
              } catch (error) {
                if (++errors >= 5) throw Error('Pages status query repeatedly failed');
                await new Promise(resolve => setTimeout(resolve, 10000)); continue;
              }
              if (status !== last) { core.info('Pages status: ' + status); last = status; }
              if (status === 'succeed') { core.setOutput('status', 'succeed'); return deployment.page_url; }
              if (failed.has(status)) throw Error('Pages deployment failed: ' + status);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw Error('Pages still processing after 30 minutes; inspect the native deployment before retrying.');
