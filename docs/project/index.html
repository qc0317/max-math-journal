<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾级 · 制作管理台</title><link rel="stylesheet" href="styles.css"></head><body>
<aside><div class="brand"><span>拾级</span><small>PRODUCTION CONTROL</small></div><nav><button data-view="overview" class="active">总览</button><button data-view="work">工作台</button><button data-view="goals">目标</button><button data-view="org">组织</button><button data-view="risks">风险与决策</button><button data-view="activity">工作日志</button></nav><div class="aside-foot"><span id="connection" class="dot">连接中</span><small id="lastSync">—</small></div></aside>
<main><header><div><p id="stage" class="eyebrow">—</p><h1 id="pageTitle">项目总览</h1></div><div class="header-actions"><span id="environment" class="badge">本地 dev</span><button id="refresh">刷新</button><button class="primary" id="newTask">只读发布版</button></div></header><div id="content"></div></main>
<dialog id="taskDialog"><form method="dialog" id="taskForm"><div class="dialog-head"><div><p class="eyebrow">WORK ITEM</p><h2 id="dialogTitle">新建任务</h2></div><button value="cancel" class="icon">×</button></div><input type="hidden" name="id"><label>任务名称<input name="title" required maxlength="100"></label><div class="form-grid"><label>负责人<input name="owner" required></label><label>模块<input name="module" required></label><label>状态<select name="status"><option value="planned">待开始</option><option value="doing">进行中</option><option value="review">待验收</option><option value="blocked">受阻</option><option value="done">已完成</option></select></label><label>优先级<select name="priority"><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select></label></div><label>下一步 / 验收条件<textarea name="next" rows="3"></textarea></label><label>记录人<input name="actor" value="用户"></label><div class="dialog-actions"><button value="cancel">取消</button><button value="default" class="primary" id="saveTask">保存</button></div></form></dialog>
<script>window.CONTROL_CENTER_READ_ONLY=true;window.CONTROL_CENTER_STATE={"schema_version": 1, "meta": {"name": "拾级", "subtitle": "项目开发看板", "updated_at": "2026-10-29T13:10:00+08:00", "environment": "开发看板", "release_state": "只读快照", "source_of_truth": "本地制作管理台（公开摘要）"}, "overview": {"mission": "建立可追溯的数学题库、练习与项目协作流程。", "current_stage": "协作框架稳定化与《资优生》题库收尾准备", "health": "需关注", "summary": "当前集中推进题库审核、质量验证与上线准备；详细学习数据和审核证据仅保存在本地。"}, "metrics": [{"label": "题库收尾", "value": "进行中", "note": "按审核流程持续推进"}, {"label": "质量验证", "value": "进行中", "note": "候选题需经过独立核验"}, {"label": "发布状态", "value": "未发布", "note": "须经用户确认"}, {"label": "看板模式", "value": "只读", "note": "敏感详情仅限本地"}], "goals": [{"id": "G-20261029-01", "level": "阶段目标", "title": "完成《资优生》题库收尾", "owner": "小欧", "status": "进行中", "progress": 8, "success": "按既定验收条件完成，并保留本地证据。"}, {"id": "G-20261029-02", "level": "当前目标", "title": "重新定位全部暂列无答案题", "owner": "小欧", "status": "等待小欧确认", "progress": 1, "success": "按既定验收条件完成，并保留本地证据。"}, {"id": "G-20261029-03", "level": "持续目标", "title": "建立稳定的本地预览—QA—用户确认—GitHub 发布链", "owner": "小马 / 小丁 / 用户", "status": "进行中", "progress": 55, "success": "按既定验收条件完成，并保留本地证据。"}], "roles": [{"name": "小岛秀夫", "role": "项目制作人", "state": "在岗", "owns": "规划、优先级、跨角色协调、交付与风险跟踪", "boundary": "不代替用户批准部署，不自行恢复用户暂停的 Goal，不扩大既定范围"}, {"name": "小欧", "role": "题库管理员", "state": "等待确认答案定位复核", "owns": "题库 PDF 入库、题干答案配图核对、分类、自查和本地可检查交付", "boundary": "不改公共构建逻辑，不盲跑同步，不自行发布"}, {"name": "小丁", "role": "独立 QA", "state": "基线已交付", "owns": "内容抽检、功能验证、问题证据、修复复查和发布建议", "boundary": "不并发全量改写题库，不以抽检替代全检结论"}, {"name": "小马", "role": "架构与集成 / 发布", "state": "迁移已完成", "owns": "数据契约、公共构建、本地候选、加密打包、GitHub 发布与线上复查", "boundary": "没有用户对具体候选版本的确认不得发布"}, {"name": "玛丽", "role": "原始试卷与分析", "state": "交接已完成", "owns": "原卷事实、作答、逐卷分析及其证据交接", "boundary": "不猜测未知事实，不擅自修改共享编号或题库定义"}, {"name": "用户", "role": "项目负责人 / 最终验收", "state": "决策", "owns": "目标、范围、优先级、候选版本验收与发布决定", "boundary": "最终决定权"}], "modules": [{"name": "题库", "group": "基础模块", "owner": "小欧", "status": "进行中", "next": "按项目工作流推进；详细事项仅限本地。"}, {"name": "延伸练习", "group": "基础模块", "owner": "待明确 / 小马集成", "status": "按计划推进", "next": "按项目工作流推进；详细事项仅限本地。"}, {"name": "原始试卷", "group": "用户模块", "owner": "玛丽", "status": "按计划推进", "next": "按项目工作流推进；详细事项仅限本地。"}, {"name": "错题", "group": "用户模块", "owner": "玛丽 / 小马集成", "status": "按计划推进", "next": "按项目工作流推进；详细事项仅限本地。"}, {"name": "分析", "group": "用户模块", "owner": "玛丽", "status": "按计划推进", "next": "按项目工作流推进；详细事项仅限本地。"}, {"name": "知识体系", "group": "用户模块", "owner": "玛丽 / 小马集成", "status": "按计划推进", "next": "按项目工作流推进；详细事项仅限本地。"}, {"name": "推荐", "group": "未来模块", "owner": "待规划", "status": "按计划推进", "next": "按项目工作流推进；详细事项仅限本地。"}], "risks": [{"severity": "中", "title": "审核与发布必须保持边界", "owner": "制作团队", "action": "验证、QA、用户确认和正式发布分别记录。"}], "decisions": [{"id": "D-PUBLIC-001", "date": "2026-10-29", "title": "公开看板仅展示脱敏摘要", "detail": "学习档案、试卷数据、题号、文件路径和审核证据不进入公共页面。"}, {"id": "D-PUBLIC-002", "date": "2026-10-29", "title": "发布继续执行分阶段确认", "detail": "本地预览、独立 QA、用户确认与正式发布保持独立。"}], "tasks": [{"id": "T-005", "title": "建立跨电脑可恢复的私有 GitHub 工作仓库", "owner": "小马 / 小岛秀夫", "status": "planned", "priority": "P1", "module": "架构与集成", "goal_id": "G-20261029-03", "next": "按内部审核流程推进，详细证据仅在本地管理台保存。", "updated_at": "2026-10-29T13:10:00+08:00"}, {"id": "T-001", "title": "完成《资优生》题库收尾", "owner": "小欧", "status": "doing", "priority": "P0", "module": "题库", "goal_id": "G-20261029-01", "next": "按内部审核流程推进，详细证据仅在本地管理台保存。", "updated_at": "2026-10-29T10:10:00+08:00"}, {"id": "T-002", "title": "重新定位全部暂列无答案题", "owner": "小欧", "status": "planned", "priority": "P1", "module": "题库", "goal_id": "G-20261029-02", "next": "按内部审核流程推进，详细证据仅在本地管理台保存。", "updated_at": "2026-10-29T10:10:00+08:00"}, {"id": "T-003", "title": "建立稳定的本地预览—QA—用户确认—GitHub 发布链", "owner": "小马 / 小丁 / 用户", "status": "doing", "priority": "P1", "module": "架构与集成", "goal_id": "G-20261029-03", "next": "按内部审核流程推进，详细证据仅在本地管理台保存。", "updated_at": "2026-10-29T10:10:00+08:00"}, {"id": "T-004", "title": "复核第一批孤立小问结构", "owner": "小欧", "status": "done", "priority": "P0", "module": "题库", "goal_id": "G-20261029-01", "next": "按内部审核流程推进，详细证据仅在本地管理台保存。", "updated_at": "2026-10-29T12:33:00+08:00"}], "activity": [{"id": "L-PUBLIC-001", "time": "2026-10-29", "actor": "制作团队", "type": "项目进展", "title": "题库审核与质量验证持续推进", "result": "当前按既定流程执行；详细记录仅限本地。"}], "settings": {"refresh_seconds": 0, "release_requires_user_approval": true}};</script><script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let state=null, view='overview';
const readOnly=Boolean(window.CONTROL_CENTER_READ_ONLY);
const statusName={planned:'待开始',doing:'进行中',review:'待验收',blocked:'受阻',done:'已完成'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,{cache:'no-store',headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{state=window.CONTROL_CENTER_STATE||await api(readOnly?'./state.json?v=20261029-1':'/api/state');$('#connection').textContent=readOnly?'只读快照':'已连接';$('#connection').className='dot ok';$('#lastSync').textContent=(readOnly?'页面载入 ':'同步 ')+new Date().toLocaleTimeString('zh-CN',{hour12:false});$('#stage').textContent=state.overview.current_stage;$('#environment').textContent=readOnly?'开发看板 · 只读':state.meta.environment+' · '+state.meta.release_state;render()}catch(e){$('#connection').textContent='连接失败';$('#connection').className='dot';$('#lastSync').textContent=e.message}}
function render(){const titles={overview:'项目总览',work:'工作台',goals:'目标管理',org:'组织与边界',risks:'风险与决策',activity:'工作日志'};$('#pageTitle').textContent=titles[view];$('#newTask').hidden=readOnly||view!=='work';const fn={overview:overviewView,work:workView,goals:goalsView,org:orgView,risks:riskView,activity:activityView}[view];$('#content').innerHTML=fn()}
function overviewView(){const doing=state.tasks.filter(x=>x.status==='doing').length,blocked=state.tasks.filter(x=>x.status==='blocked').length;return `<section class="hero"><p class="eyebrow">MISSION / CURRENT STAGE</p><h2>${esc(state.overview.mission)}</h2><p>${esc(state.overview.summary)}</p></section><section class="grid metrics" style="margin-top:14px"><div class="metric"><span>进行中任务</span><b>${doing}</b><small>跨模块工作项</small></div><div class="metric"><span>受阻</span><b>${blocked}</b><small>需要协调或决策</small></div>${state.metrics.slice(0,2).map(x=>`<div class="metric"><span>${esc(x.label)}</span><b>${esc(x.value)}</b><small>${esc(x.note)}</small></div>`).join('')}</section><section class="grid layout"><div class="panel"><div class="panel-head"><h2>当前目标</h2><span class="muted">${state.goals.length} 项</span></div>${state.goals.map(goalCard).join('')}</div><div class="panel"><div class="panel-head"><h2>需要关注</h2><span class="muted">${state.risks.length} 项</span></div>${state.risks.slice(0,5).map(r=>`<div class="goal"><div class="goal-line"><b>${esc(r.title)}</b><span class="status review">${esc(r.severity)}</span></div><small class="muted">${esc(r.owner)} · ${esc(r.action)}</small></div>`).join('')}</div></section>`}
function goalCard(x){return `<div class="goal"><div class="goal-line"><div><b>${esc(x.title)}</b><small class="muted"> · ${esc(x.owner)}</small></div><span class="status ${x.status==='进行中'?'doing':''}">${esc(x.status)}</span></div><div class="progress"><i style="width:${Number(x.progress)||0}%"></i></div><small class="muted">${esc(x.success)}</small></div>`}
function workView(){const cols=[['planned','待开始'],['doing','进行中'],['review','待验收'],['blocked','受阻']];return `<div class="board">${cols.map(([key,label])=>`<section class="column"><h3>${label} · ${state.tasks.filter(x=>x.status===key).length}</h3>${state.tasks.filter(x=>x.status===key).map(taskCard).join('')}</section>`).join('')}</div>${state.tasks.some(x=>x.status==='done')?`<div class="panel" style="margin-top:14px"><div class="panel-head"><h2>最近完成</h2></div>${state.tasks.filter(x=>x.status==='done').map(taskCard).join('')}</div>`:''}`}
function taskCard(x){return `<article class="task" data-task="${esc(x.id)}"><div class="task-head"><span class="priority">${esc(x.priority)}</span><small class="muted">${esc(x.module)}</small></div><b>${esc(x.title)}</b><small class="muted">${esc(x.owner)} · ${esc(x.id)}</small><p>${esc(x.next)}</p></article>`}
function goalsView(){return `<div class="panel"><div class="panel-head"><h2>阶段与持续目标</h2><span class="muted">目标必须包含成功条件</span></div>${state.goals.map(goalCard).join('')}</div>`}
function orgView(){return `<div class="grid role-grid">${state.roles.map(x=>`<article class="card role"><p class="eyebrow">${esc(x.role)}</p><h3>${esc(x.name)}</h3><span class="status doing">${esc(x.state)}</span><p><b>负责：</b>${esc(x.owns)}</p><div class="boundary"><b>能力边界</b><br>${esc(x.boundary)}</div></article>`).join('')}</div><div class="panel" style="margin-top:14px"><div class="panel-head"><h2>模块归属</h2></div>${state.modules.map(x=>`<div class="list-row"><b>${esc(x.name)}</b><span>${esc(x.status)}<br><small class="muted">下一步：${esc(x.next)}</small></span><small>${esc(x.owner)}</small></div>`).join('')}</div>`}
function riskView(){return `<section class="grid layout"><div class="panel"><div class="panel-head"><h2>风险与阻塞</h2></div>${state.risks.map(x=>`<div class="list-row"><span class="status ${x.severity==='高'?'blocked':'review'}">${esc(x.severity)}</span><span><b>${esc(x.title)}</b><br><small class="muted">${esc(x.action)}</small></span><small>${esc(x.owner)}</small></div>`).join('')}</div><div class="panel"><div class="panel-head"><h2>关键决策</h2></div>${state.decisions.map(x=>`<div class="goal"><small class="muted">${esc(x.date)}</small><br><b>${esc(x.title)}</b><p>${esc(x.detail)}</p></div>`).join('')}</div></section>`}
function activityView(){return `<div class="panel"><div class="panel-head"><h2>自动工作日志</h2><span class="muted">管理台变更自动写入</span></div><div class="timeline">${state.activity.map(x=>`<div class="event"><small class="muted">${esc(x.time)} · ${esc(x.actor)} · ${esc(x.type)}</small><h3>${esc(x.title)}</h3><p>${esc(x.result)}</p></div>`).join('')}</div></div>`}
function openTask(item={}){const f=$('#taskForm');f.reset();for(const [k,v] of Object.entries(item))if(f.elements[k])f.elements[k].value=v??'';$('#dialogTitle').textContent=item.id?'编辑任务':'新建任务';$('#taskDialog').showModal()}
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});$('#refresh').onclick=load;$('#newTask').onclick=()=>openTask();
$('#content').onclick=e=>{if(readOnly)return;const card=e.target.closest('[data-task]');if(card)openTask(state.tasks.find(x=>x.id===card.dataset.task))};
$('#saveTask').onclick=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData($('#taskForm')));const id=data.id;delete data.id;await api(id?`/api/items/tasks/${id}`:'/api/items/tasks',{method:id?'PATCH':'POST',body:JSON.stringify(data)});$('#taskDialog').close();await load()};
load();setInterval(load,8000);
</script></body></html>
